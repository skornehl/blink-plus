trigger_camera:
  target:
    entity:
      integration: blink_plus
      domain: camera

start_live_view:
  target:
    entity:
      integration: blink_plus
      domain: camera
  fields:
    seconds:
      default: 60
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s

stop_live_view:
  target:
    entity:
      integration: blink_plus
      domain: camera

play_audio:
  target:
    entity:
      integration: blink_plus
      domain: camera
  fields:
    file_path:
      required: true
      example: /media/sounds/be_right_there.mp3
      selector:
        text:
